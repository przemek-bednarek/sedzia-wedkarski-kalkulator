<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Klasyfikacja Zawodów Wędkarskich</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:hsl(200 30% 96.1%);--surface:#fff;--ink:hsl(196 52% 8.2%);--muted:hsl(199 17% 33.1%);
    --teal:hsl(188 100% 27.1%);--on-teal:#fff;--soft:hsl(188 64% 88%);--soft-ink:hsl(188 100% 18.6%);
    --line:hsl(200 26% 86.3%);--edge:hsl(199 17% 52%);--drop-edge:hsl(188 55% 40%);
    --r:10px;--rs:13px;--logo:#14525a;
    --g1-bg:#fff6dd;--g1:#805b00;--g1-bar:#c18d20;
    --s2-bg:#eef3f6;--s2:#425c6a;
    --b3-bg:#faf0e9;--b3:#865132;
    --warn:#fff6e0;--warn-line:#f0d59a;--err:#fdecec;--err-line:#e0a3a3;
    --font:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:3px solid var(--soft-ink);outline-offset:2px}
  header{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;gap:16px;align-items:center}
  .logo{width:58px;height:auto;aspect-ratio:56.4/37.21;color:var(--logo);flex:none}
  h1{margin:0;font-size:23px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
  header p{margin:3px 0 0;color:var(--muted);font-size:15px}
  main{max-width:1180px;margin:0 auto;padding:24px 20px 56px}
  .drop{border:2px dashed var(--drop-edge);border-radius:var(--rs);background:var(--surface);padding:34px 20px;text-align:center;cursor:pointer;min-height:44px}
  .drop:hover,.drop.over{background:var(--soft)}
  .drop .ic{width:56px;height:56px;border-radius:50%;background:var(--soft);color:var(--teal);display:grid;place-items:center;margin:0 auto 12px}
  .drop b{display:block;font-size:18px;font-weight:600}.drop span{color:var(--muted);font-size:15px}
  .compact .drop{padding:12px 16px}.compact .drop .ic{width:36px;height:36px;margin-bottom:4px}.compact .drop .ic svg{width:20px;height:20px}.compact .drop b{font-size:16px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
  .chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted);background:var(--surface)}
  .chip b{font-weight:700;color:var(--ink)}
  .chip.b{background:var(--soft);border-color:transparent;color:var(--soft-ink)}.chip.b b{color:var(--soft-ink)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
  .tab{min-height:44px;border:1px solid var(--edge);background:var(--surface);border-radius:var(--r);padding:8px 14px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
  .tab:hover{background:var(--bg)}
  .tab.on{background:var(--teal);border-color:var(--teal);color:var(--on-teal);font-weight:600}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
  th{background:var(--bg);color:var(--soft-ink);text-align:left;font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:bottom}
  td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td:first-child,th:first-child{border-left:4px solid transparent}
  td b{font-weight:600}
  tr.r1{background:var(--g1-bg)}tr.r1 td:first-child{border-left-color:var(--g1-bar)}tr.r1 td b{font-size:17px}
  tr.r2{background:var(--s2-bg)}
  tr.r3{background:var(--b3-bg)}
  .num{text-align:center}.pts{color:var(--teal);font-weight:700;font-size:21px}
  .medal{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-weight:600;font-size:14px;border:2px solid transparent;color:var(--ink)}
  .p1,.p2,.p3{background:#fff;font-weight:700}
  .place{display:inline-flex;align-items:center;gap:6px}
  .cup,.cupslot{width:20px;height:20px;flex:none}
  .c1{--cf:#c18d20;--cs:#805b00}.c2{--cf:#b9c8d1;--cs:#425c6a}.c3{--cf:#c98a62;--cs:#865132}
  .p1{border-color:var(--g1);color:var(--g1)}.p2{border-color:var(--s2);color:var(--s2)}.p3{border-color:var(--b3);color:var(--b3)}
  .tag{display:inline-block;background:var(--soft);color:var(--soft-ink);border-radius:7px;padding:3px 9px;margin:2px 6px 2px 0;font-size:13px;font-weight:500}
  td.hide-s .tag{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
  .muted{color:var(--muted)}
  .warn{background:var(--warn);border:1px solid var(--warn-line);border-radius:var(--rs);padding:12px 16px;margin:14px 0;font-size:14px}
  .warn ul{margin:6px 0 0;padding-left:20px}
  .warn summary{cursor:pointer;min-height:24px}
  .err{background:var(--err);border-color:var(--err-line)}
  .bar{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin:0 0 6px;flex-wrap:wrap}
  .bar input{border:1px solid var(--edge);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:8px 12px;min-height:44px;font:inherit;font-size:15px;min-width:260px}
  .btn{min-height:44px;border:1px solid var(--teal);background:var(--teal);color:var(--on-teal);border-radius:var(--r);padding:8px 16px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .btn.prn{background:var(--surface);color:var(--ink);border-color:var(--edge)}
  .btn:hover{filter:brightness(.94)}
  .pubhint{color:var(--muted);font-size:13px;text-align:right;margin:0 0 14px}
  .status{color:var(--muted);font-size:13px;text-align:right;margin:-8px 0 12px}.status:empty{display:none}
  .hint{color:var(--muted);font-size:13px;margin-top:14px}
  .phead,.sig{display:none}
  @media (max-width:720px){
    .status{text-align:left}
    header{padding:14px 16px;gap:12px}h1{font-size:22px}.logo{width:48px}
    main{padding:16px 12px 48px}
    td,th{padding:9px 8px}td{font-size:14px}.pts{font-size:19px}.hide-s{display:none}td.num{white-space:nowrap}.tag{white-space:nowrap}
    .bar input{min-width:0;flex:1 1 100%}.bar .btn{flex:1 1 auto}.pubhint{text-align:left}
  }
  @page{size:A4 landscape;margin:12mm}
  @media print{
    header,.drop,.chips,.tabs,.bar,.pubhint,.status,.warn,.hint{display:none!important}
    main{padding:0;max-width:none}
    .phead{display:flex;align-items:center;gap:14px;margin:0 0 10px}
    .plogo{width:56px;height:auto;aspect-ratio:56.4/37.21;color:var(--logo);flex:none}
    .ptitle{font-size:18px;font-weight:700}
    .card{border:0;border-radius:0;overflow:visible}
    table{font-size:11px}
    th{padding:5px 6px;font-size:11px}
    td{padding:3px 6px;font-size:11px}
    .hide-s{display:table-cell!important}
    td.num,td{white-space:normal}
    .pts{font-size:13px}
    tr.r1 td b{font-size:12px}
    .medal{width:24px;height:24px;font-size:11px;border-width:1.5px}
    .tag{padding:1px 6px;margin:1px 4px 1px 0;font-size:11px}
    thead{display:table-header-group}tr{break-inside:avoid}
    .sig{display:block;text-align:right;margin-top:16px;font-size:11px}
    /* publikacja: kolory marki, wymuszone drukiem tła */
    body[data-export="pub"],body[data-export="pub"] *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body[data-export="pub"]{background:var(--bg)}
    body[data-export="pub"] .ptitle{color:var(--soft-ink)}
    body[data-export="pub"] th{background:var(--soft);border-bottom:1px solid var(--teal)}
    body[data-export="pub"] td{border-bottom-color:hsl(188 30% 84%)}
    /* druk (domyślny też dla Ctrl+P): bez wypełnień, obrazów tła, cieni i kolorów */
    body:not([data-export="pub"]),body:not([data-export="pub"]) *{background:none!important;background-image:none!important;box-shadow:none!important;text-shadow:none!important;filter:none!important;color:#000!important}
    body:not([data-export="pub"]) th{border-bottom:1.5px solid #000}
    body:not([data-export="pub"]) td{border-bottom:1px solid #bbb}
    body:not([data-export="pub"]) td:first-child,body:not([data-export="pub"]) th:first-child{border-left-color:transparent!important}
    body:not([data-export="pub"]) td b{font-weight:400}
    body:not([data-export="pub"]) tr.r1 td b,body:not([data-export="pub"]) tr.r2 td b,body:not([data-export="pub"]) tr.r3 td b{font-weight:700}
    body:not([data-export="pub"]) .medal{border-color:transparent!important;font-weight:400}
    body:not([data-export="pub"]) .p1,body:not([data-export="pub"]) .p2,body:not([data-export="pub"]) .p3{font-weight:700}
    body:not([data-export="pub"]) .tag{border:0!important}
    body:not([data-export="pub"]) .cup{--cf:none!important;--cs:#000!important}
    body:not([data-export="pub"]) .pts{font-weight:700}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><symbol id="logo-mark" viewBox="3.8 5.49 56.4 37.21"><path fill="currentColor" d="M29.5 9.8C25 6.2 14 4.6 7.5 6.5C5.17 7.17 4 8.67 4 11L4 36.5C4 38.83 5.17 39.67 7.5 39C14 37.2 25 38.6 29.5 42.5L29.5 27.89C27.56 27.02 25.84 26.1 24.2 25.4L13.5 30.8C17.5 26.27 17.5 21.73 13.5 17.2L24.2 22.6C25.84 21.9 27.56 20.98 29.5 20.11L29.5 9.8ZM34.5 9.8C39 6.2 50 4.6 56.5 6.5C58.83 7.17 60 8.67 60 11L60 36.5C60 38.83 58.83 39.67 56.5 39C50 37.2 39 38.6 34.5 42.5L34 29.6C34 29.6 34 29.6 34 29.6C43.5 32.4 52.6 28.4 53 24C52.6 19.6 43.5 15.6 34 18.4C34 18.4 34 18.4 34 18.4L34.5 9.8Z"/></symbol><symbol id="cup" viewBox="0 0 24 24"><g style="stroke:var(--cs)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-1.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98 1.97 1.21C16.15 18.75 17 20.24 17 22"/><path class="cup-body" style="fill:var(--cf)" d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></g></symbol></svg>
<header>
  <svg class="logo" viewBox="3.8 5.49 56.4 37.21" role="img" aria-label="Dziennik Wędkarza"><use href="#logo-mark"/></svg>
  <div><h1>Klasyfikacja Zawodów Wędkarskich</h1><p>Ranking na podstawie 2 najlepszych tur · system sektorowy</p></div>
</header>
<main id="app">
  <div class="drop" id="drop" tabindex="0" role="button">
    <div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 15v4h16v-4"/></svg></div>
    <b>Przeciągnij plik .xlsx lub kliknij</b><span>Plik Excel z wynikami zawodów – każda tura w osobnym arkuszu</span>
    <input id="file" type="file" accept=".xlsx,.xls" hidden>
  </div>
  <div id="out"></div>
  <p class="hint">Dane są liczone wyłącznie w Twojej przeglądarce – plik nie jest nigdzie wysyłany.</p>
</main>
<script src="vendor/xlsx.full.min.js"></script>
<script type="module" src="src/app.js?v=4"></script>
</body>
</html>
