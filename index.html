<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klasyfikacja Zawodów Wędkarskich</title>
<style>
  :root{--bg:#f8f9fb;--card:#fff;--ink:#1c2230;--muted:#6b7385;--line:#e3e6ee;--blue:#2f6fd0;--blue-soft:#e7eef9;--gold:#f6b93b;--gold-soft:#fdf1d8;--silver-soft:#eceef2;--bronze-soft:#f6e6da;--warn:#fff6e0;--warn-line:#f0d59a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 28px;display:flex;gap:16px;align-items:center}
  .logo{width:44px;height:44px;border-radius:11px;background:var(--blue);display:grid;place-items:center;flex:none}
  h1{margin:0;font-size:22px;letter-spacing:-.02em}
  header p{margin:2px 0 0;color:var(--muted);font-size:15px}
  main{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
  .drop{border:2px dashed #c9ced9;border-radius:16px;background:#f8f9fb;padding:34px 20px;text-align:center;cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--blue);background:#eef4fc}
  .drop .ic{width:60px;height:60px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;margin:0 auto 12px}
  .drop b{display:block;font-size:18px}.drop span{color:var(--muted);font-size:14px}
  .compact .drop{padding:18px}.compact .drop .ic{width:40px;height:40px;margin-bottom:6px}.compact .drop b{font-size:15px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
  .chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted);background:#fff}
  .chip.b{background:var(--blue-soft);border-color:transparent;color:#1f4c93;font-weight:600}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
  .tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer;color:var(--muted)}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{background:#f3f4f7;text-align:left;font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:bottom}
  td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .num{text-align:center}.pts{color:var(--blue);font-weight:700;font-size:17px}
  .medal{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:14px;color:#555}
  .m2{background:var(--silver-soft)}
  .m1{background:var(--gold-soft);color:#b27a00}.m3{background:var(--bronze-soft);color:#9a5b2b}
  .tag{display:inline-block;background:#e9f0fb;color:#1f4c93;border-radius:7px;padding:3px 9px;margin:2px 6px 2px 0;font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace}
  .muted{color:var(--muted)}
  .warn{background:var(--warn);border:1px solid var(--warn-line);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px}
  .warn ul{margin:6px 0 0;padding-left:20px}
  .err{background:#fdecec;border-color:#f2b8b8}
  .bar{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin:0 0 12px;flex-wrap:wrap}
  .bar input{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font:inherit;font-size:14px;min-width:260px}
  .btn{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:9px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .hint{color:var(--muted);font-size:13px;margin-top:14px}
  .sig,.ptitle{display:none}
  @media (max-width:720px){header{padding:14px 16px}td,th{padding:9px 8px;font-size:13px}.hide-s{display:none}}
  @page{size:A4 landscape;margin:12mm}
  @media print{
    body{background:#fff}header,.drop,.chips,.tabs,.bar,.warn,.hint{display:none!important}
    main{padding:0;max-width:none}.card{border:0;border-radius:0}
    .ptitle{display:block;font-size:18px;font-weight:700;margin:0 0 10px}
    th{background:#fff;border-bottom:1.5px solid #000;padding:5px 6px;font-size:11px}
    td{padding:3px 6px;font-size:11px;border-bottom:1px solid #ddd}
    .medal{background:none!important;width:auto;height:auto;border-radius:0;color:#000!important;display:inline}
    .tag{background:none;color:#000;padding:0 6px 0 0;font:11px Inter,system-ui,sans-serif}
    .pts{color:#000;font-size:11px}
    thead{display:table-header-group}tr{break-inside:avoid}
    .sig{display:block;text-align:right;margin-top:18px;font-size:11px}
  }
</style>
</head>
<body>
<header>
  <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c3-4.5 8-5.5 12-3.5-1.2 1-1.7 2.2-1.7 3.5s.5 2.5 1.7 3.5c-4 2-9 1-12-3.5Z"/><path d="M6.5 12 2.5 8.5v7L6.5 12Z"/><circle cx="14" cy="11" r=".6" fill="#fff"/></svg></div>
  <div><h1>Klasyfikacja Zawodów Wędkarskich</h1><p>Ranking na podstawie 2 najlepszych tur · system sektorowy</p></div>
</header>
<main id="app">
  <div class="drop" id="drop" tabindex="0">
    <div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2f6fd0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 15v4h16v-4"/></svg></div>
    <b>Przeciągnij plik .xlsx lub kliknij</b><span>Plik Excel z wynikami zawodów – każda tura w osobnym arkuszu</span>
    <input id="file" type="file" accept=".xlsx,.xls" hidden>
  </div>
  <div id="out"></div>
  <p class="hint">Dane są liczone wyłącznie w Twojej przeglądarce – plik nie jest nigdzie wysyłany.</p>
</main>
<script src="vendor/xlsx.full.min.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
